<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trustpilot Report — MarketingAI</title>

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "outline-variant": "#a5adc6",
            "surface-container":         "#e2e7ff",
            "surface-container-low":     "#eef0ff",
            "surface-container-high":    "#d9e2ff",
            "surface-container-lowest":  "#ffffff",
            "on-surface":         "#272e42",
            "on-surface-variant": "#535b71",
            "on-primary":         "#f7f0ff",
            "primary":            "#6200EE",
            "primary-container":  "#ac8eff",
            "secondary":          "#00C8DC",
          },
          fontFamily: { "headline": ["Plus Jakarta Sans"], "body": ["Inter"] },
          borderRadius: { "DEFAULT": "1rem", "lg": "2rem", "full": "9999px" },
        },
      },
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; color: #272e42; line-height: 1.6; }
    h1, h2, h3 { font-family: 'Plus Jakarta Sans', sans-serif; line-height: 1.2; }

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

    .tab-btn.active { background: #00b67a; color: #ffffff; border-color: transparent; box-shadow: 0 4px 16px rgba(0,182,122,0.25); }
    .tab-btn:not(.active):hover { background: rgba(255,255,255,0.50); }
    .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; line-height: 1; vertical-align: middle; display: inline-block; }
    .ms-xs { font-size: 14px; }
    .ms-sm { font-size: 18px; }
    .ms-xl { font-size: 48px; }
  </style>
</head>
<body class="min-h-screen">

<!-- Animated background -->
<div id="bg-layer" style="position:fixed;inset:0;z-index:-1;background-color:#e8fff5;">
  <div id="hero-blob-1" class="absolute w-[800px] h-[800px] blur-[120px] rounded-full" style="left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,182,122,0.28);"></div>
  <div id="hero-blob-2" class="absolute w-[400px] h-[400px] blur-[100px] rounded-full" style="left:75%;top:25%;transform:translate(-50%,-50%);background:rgba(0,182,122,0.12);"></div>
</div>

  <!-- Nav -->
  <nav class="fixed top-0 w-full z-50 bg-white/80 backdrop-blur-xl border-b border-outline-variant/10">
    <div class="flex items-center justify-between px-6 sm:px-8 py-4 max-w-7xl mx-auto">
      <a href="../index.html" class="text-xl font-black tracking-tighter text-[#6a1cf6] font-headline">Marketing<span class="text-[#00C8DC]">AI</span></a>
      <div class="relative group">
        <a href="../Social-Listening-Digest.html" class="flex items-center gap-1 text-sm font-semibold text-on-surface-variant hover:text-primary transition-colors duration-200">Social Listening Digest <span class="material-symbols-outlined" style="font-size:16px;line-height:1;vertical-align:middle">expand_more</span></a>
        <div class="absolute right-0 top-full pt-2 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 z-50">
          <div class="bg-white rounded-2xl shadow-[0_4px_20px_rgba(0,0,0,0.10)] border border-outline-variant/15 overflow-hidden" style="min-width:200px">
            <div class="p-1.5">
              <a href="../trustpilot-reports/index.html" class="flex items-center gap-2.5 px-3 py-2 text-sm font-medium text-on-surface-variant hover:bg-surface-container hover:text-on-surface transition-colors" style="border-radius:8px"><img src="https://cdn.simpleicons.org/trustpilot/00b67a" class="w-3.5 h-3.5 shrink-0" alt="">Trustpilot Reports</a>
              <a href="../reddit-reports/index.html" class="flex items-center gap-2.5 px-3 py-2 text-sm font-medium text-on-surface-variant hover:bg-surface-container hover:text-on-surface transition-colors" style="border-radius:8px"><img src="https://cdn.simpleicons.org/reddit/FF4500" class="w-3.5 h-3.5 shrink-0" alt="">Reddit Reports</a>
            </div>
            <div class="border-t border-outline-variant/10 px-4 py-2">
              <a href="../Social-Listening-Digest.html" class="flex items-center gap-1.5 text-xs font-semibold text-primary hover:opacity-80 transition-opacity"><span class="material-symbols-outlined" style="font-size:12px">grid_view</span>All reports</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- Page header — breadcrumb, title & stats moved out of nav -->
  <div class="pt-24 pb-2 px-4 sm:px-8">
    <div class="max-w-7xl mx-auto px-6 py-4 rounded-2xl" style="background:rgba(255,255,255,0.28);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,0.5);box-shadow:0 8px 32px rgba(0,182,122,0.06),inset 0 1px 0 rgba(255,255,255,0.6);">
      <nav class="flex items-center gap-2 text-sm text-on-surface-variant flex-wrap">
        <a href="../index.html" class="hover:text-primary transition-colors">Home</a>
        <span class="text-outline-variant">›</span>
        <a href="../Social-Listening-Digest.html" class="hover:text-primary transition-colors">Social Listening Digest</a>
        <span class="text-outline-variant">›</span>
        <a href="index.html" class="transition-colors hover:text-[#00b67a]">Trustpilot</a>
        <span class="text-outline-variant">›</span>
        <span id="page-title" class="font-semibold text-on-surface">Loading...</span>
      </nav>
      <div id="stats" class="hidden text-sm text-on-surface-variant mt-2"></div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="px-4 sm:px-8 py-3">
    <div class="max-w-7xl mx-auto flex gap-2 overflow-x-auto">
      <button class="tab-btn active text-sm font-medium px-4 py-2 rounded-lg whitespace-nowrap inline-flex items-center gap-1.5" onclick="showTab('reviews')"><span class="material-symbols-outlined ms-sm">rate_review</span> Reviews</button>
      <button class="tab-btn text-sm font-medium px-4 py-2 rounded-lg text-on-surface-variant whitespace-nowrap inline-flex items-center gap-1.5" onclick="showTab('analysis')"><span class="material-symbols-outlined ms-sm">troubleshoot</span> Pain Point Analysis</button>
      <button class="tab-btn text-sm font-medium px-4 py-2 rounded-lg text-on-surface-variant whitespace-nowrap inline-flex items-center gap-1.5" onclick="showTab('blog')"><span class="material-symbols-outlined ms-sm">edit_note</span> Blog Ideas</button>
    </div>
  </div>

  <!-- Main -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8">

    <!-- Loading -->
    <div id="loading" class="text-center py-20 text-on-surface-variant">
      <div class="mb-4"><span class="material-symbols-outlined ms-xl" style="color:#a5adc6">hourglass_empty</span></div>
      <p>Loading report data...</p>
    </div>

    <!-- Reviews Tab -->
    <div id="tab-reviews" class="hidden">
      <div id="reviews-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
    </div>

    <!-- Analysis Tab -->
    <div id="tab-analysis" class="hidden">
      <div id="analysis-content"></div>
    </div>

    <!-- Blog Tab -->
    <div id="tab-blog" class="hidden">
      <div id="blog-content"></div>
    </div>

  </main>

  <script>
    // ── Helpers ──────────────────────────────────────────────────────────────

    function getWeekParam() {
      return new URLSearchParams(window.location.search).get('week');
    }

    function goToReview(n) {
      showTab('reviews');
      setTimeout(() => {
        const el = document.getElementById('review-card-' + n);
        if (!el) return;
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        el.classList.add('ring-2', 'ring-[#00b67a]');
        setTimeout(() => el.classList.remove('ring-2', 'ring-[#00b67a]'), 2000);
      }, 60);
    }

    function showTab(name) {
      ['reviews', 'analysis', 'blog'].forEach(t => {
        document.getElementById('tab-' + t).classList.add('hidden');
      });
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('active');
        btn.classList.add('text-on-surface-variant');
      });
      document.getElementById('tab-' + name).classList.remove('hidden');
      document.querySelectorAll('.tab-btn').forEach(btn => {
        if (btn.getAttribute('onclick') === `showTab('${name}')`) {
          btn.classList.add('active');
          btn.classList.remove('text-on-surface-variant');
        }
      });
    }

    // ════════════════════════════════════════════════════════════════════════
    // PARSING UTILITIES — format-agnostic, works with any Claude/Gemini output
    // ════════════════════════════════════════════════════════════════════════

    function mdToHtml(line) {
      return line
        .replace(/^\s*[\*\-]\s*/g, '')
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .trim();
    }

    function stripMd(line) {
      return line.replace(/^[\*#\s]+/, '').replace(/[\*]+$/, '').trim();
    }

    function isSeparator(line) {
      return /^[\-─*=]{3,}\s*$/.test(line.trim());
    }

    function isJunk(line) {
      const s = line.trim();
      return !s || /^\*+$/.test(s) || isSeparator(s);
    }

    function getField(block, labelPattern) {
      const re = new RegExp(`\\*{0,2}${labelPattern}\\*{0,2}\\s*(.+?)(?:\\n|$)`, 'i');
      const m  = block.match(re);
      return m ? stripMd(m[1]) : '';
    }

    // ── Section splitter ─────────────────────────────────────────────────────

    function parseReport(text) {
      const sections = { analysis: '', blog: '' };
      if (!text) return sections;

      const findSection = (n) => {
        const m = text.match(new RegExp(`^[\\*#\\s]*SECTION\\s+${n}[^\\n]*`, 'im'));
        return m ? m.index : -1;
      };

      const s2 = findSection(2);
      const s3 = findSection(3);

      if (s2 !== -1 && s3 !== -1) sections.analysis = text.slice(s2, s3).trim();
      else if (s2 !== -1)          sections.analysis = text.slice(s2).trim();
      if (s3 !== -1)               sections.blog     = text.slice(s3).trim();

      return sections;
    }

    // ── Review reference buttons ──────────────────────────────────────────────

    function reviewButton(num) {
      return `<button onclick="goToReview(${num})"
        style="color:#00b67a;background:rgba(0,182,122,0.09)" class="group inline-flex items-center gap-1 font-semibold text-xs px-2 py-0.5 rounded-full transition-colors cursor-pointer hover:opacity-80">
        Review ${num} <span class="material-symbols-outlined transition-transform group-hover:rotate-45" style="font-size:12px;line-height:1">north_east</span>
      </button>`;
    }

    // "(Review 15 — 1 star)" / "(Review 15, 28)" / "(Review 15, Review 28)"
    function linkReviewRefs(text) {
      return text.replace(/\(Review[^)]+\)/gi, (match) => {
        // Strip star-rating suffixes (e.g. "— 1 star", "1 stars") before extracting digits
        // so "Review 28 — 1 star" doesn't yield a spurious "Review 1" button
        const cleaned = match.replace(/[\-–—\s]*\d+\s*stars?\b/gi, '');
        const nums = [...cleaned.matchAll(/\b(\d+)\b/g)].map(m => m[1]);
        if (!nums.length) return match;
        return nums.map(n => reviewButton(n)).join(' ');
      });
    }

    // ── Star rating display ───────────────────────────────────────────────────

    function starBadge(rating) {
      const n = parseInt(rating) || 0;
      const colors = {
        1: 'bg-red-100 text-red-700',
        2: 'bg-orange-100 text-orange-700',
        3: 'bg-yellow-100 text-yellow-700',
        4: 'bg-green-100 text-green-700',
        5: 'bg-emerald-100 text-emerald-700',
      };
      const cls = colors[n] || 'bg-surface-container text-on-surface-variant';
      return `<span class="text-xs font-semibold px-2 py-0.5 rounded-full ${cls}">${'★'.repeat(n)}${'☆'.repeat(5 - n)}</span>`;
    }

    // ── Parse AI report text into sections ───────────────────────────────────
    // Supports both Gemini (**SECTION 2:) and Claude (## SECTION 2:) formats

    function parseReport(text) {
      const sections = { analysis: '', blog: '' };
      if (!text) return sections;

      const s2 = text.search(/^(?:\*{1,2}|#{1,3})\s*SECTION\s+2[:\s]/im);
      const s3 = text.search(/^(?:\*{1,2}|#{1,3})\s*SECTION\s+3[:\s]/im);

      if (s2 !== -1 && s3 !== -1) sections.analysis = text.slice(s2, s3).trim();
      else if (s2 !== -1) sections.analysis = text.slice(s2).trim();

      if (s3 !== -1) sections.blog = text.slice(s3).trim();

      return sections;
    }

    // ── Render reviews ────────────────────────────────────────────────────────

    function renderReviews(reviews) {
      const grid = document.getElementById('reviews-grid');

      if (!reviews.length) {
        grid.innerHTML = '<p class="text-on-surface-variant col-span-2 text-center py-10">No reviews found for this week.</p>';
        return;
      }

      reviews.forEach((review, idx) => {
        const num = idx + 1;
        const card = document.createElement('div');
        card.id = 'review-card-' + num;
        card.className = 'bg-white rounded-2xl border border-outline-variant/15 p-6 flex flex-col gap-3 hover:shadow-md transition-shadow';

        const dateStr = review.date
          ? new Date(review.date).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })
          : '';

        card.innerHTML = `
          <div class="flex items-center gap-2 flex-wrap">
            <span class="text-xs font-semibold bg-surface-container text-on-surface-variant px-2 py-0.5 rounded-full">Review ${num}</span>
            <span class="text-xs font-semibold bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full">${review.company || ''}</span>
            ${starBadge(review.rating)}
          </div>
          <a href="${review.url || '#'}" target="_blank" class="font-bold text-base leading-snug hover:text-[#00b67a] transition-colors">
            ${review.title || '(no title)'}
          </a>
          ${review.text ? `<p class="text-sm text-on-surface-variant line-clamp-3">${review.text.slice(0, 300)}${review.text.length > 300 ? '…' : ''}</p>` : ''}
          <div class="flex gap-4 text-xs text-on-surface-variant flex-wrap">
            <span class="inline-flex items-center gap-1"><span class="material-symbols-outlined ms-xs">person</span> ${review.author || 'Unknown'}</span>
            <span class="inline-flex items-center gap-1"><span class="material-symbols-outlined ms-xs">calendar_today</span> ${dateStr}</span>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // ── Render Pain Point Analysis ────────────────────────────────────────────

    function renderAnalysis(text) {
      const container = document.getElementById('analysis-content');
      if (!text) {
        container.innerHTML = '<p class="text-on-surface-variant text-center py-10">No analysis available.</p>';
        return;
      }

      const body = text.replace(/^[^\n]*SECTION[^\n]*\n*/i, '').trim();

      // Find all theme start positions
      const themeRe = /^[\*#\s]*Theme\s*\d*\s*:/gim;
      const themeStarts = [];
      let tm;
      while ((tm = themeRe.exec(body)) !== null) themeStarts.push(tm.index);

      if (!themeStarts.length) {
        container.innerHTML = `<div class="bg-white rounded-2xl border border-outline-variant/15 p-6">
          <div class="text-sm text-on-surface leading-relaxed">${linkReviewRefs(mdToHtml(body))}</div></div>`;
        return;
      }

      const blocks = themeStarts.map((start, i) =>
        body.slice(start, themeStarts[i + 1] ?? body.length).trim()
      );

      const cards = blocks.map(block => {
        const lines = block.split('\n');
        const themeName = stripMd(lines[0]).replace(/^Theme\s*\d*\s*:\s*/i, '').trim();

        const exHeaderIdx = lines.findIndex((l, i) =>
          i > 0 && /(?:paraphrased\s+)?(?:review)\s+examples?/i.test(l)
        );

        let painLines = [], exampleLines = [];

        if (exHeaderIdx !== -1) {
          painLines = lines.slice(1, exHeaderIdx)
            .map(mdToHtml)
            .filter(l => !isJunk(l) && !/^(?:Pain Points?|Key Points?)\s*:?\s*$/i.test(l));
          exampleLines = lines.slice(exHeaderIdx + 1)
            .map(l => l.replace(/^\s*[\*\-]\s*/g, '').trim())
            .filter(l => !isJunk(l) && !/^-+$/.test(l));
        } else {
          painLines = lines.slice(1)
            .map(mdToHtml)
            .filter(l => !isJunk(l) && !/^(?:Pain Points?|Key Points?)\s*:?\s*$/i.test(l));
        }

        const painHtml = painLines.length ? `
          <ul class="space-y-2 mb-4">
            ${painLines.map(l => `<li class="flex gap-2 text-sm text-on-surface"><span class="shrink-0 mt-0.5" style="color:rgba(0,182,122,0.7)">▸</span><span>${l}</span></li>`).join('')}
          </ul>` : '';

        const examplesHtml = exampleLines.length ? `
          <div class="border-t border-outline-variant/10 pt-4 mt-2">
            <p class="text-xs font-semibold text-on-surface-variant uppercase tracking-wide mb-3">Paraphrased Review Examples</p>
            <div class="space-y-2">
              ${exampleLines.map(l => `
                <div class="flex gap-2 text-sm text-on-surface bg-surface-container-low rounded-lg px-3 py-2">
                  <span class="text-outline-variant shrink-0">"</span>
                  <span>${linkReviewRefs(l.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>'))}</span>
                </div>`).join('')}
            </div>
          </div>` : '';

        return `
          <div class="bg-white rounded-2xl border border-outline-variant/15 p-6 hover:shadow-md transition-shadow">
            <h3 class="font-bold text-base text-on-surface mb-4 flex items-start gap-2">
              <span class="shrink-0 mt-0.5" style="color:#00b67a">●</span>${themeName}
            </h3>
            ${painHtml}${examplesHtml}
          </div>`;
      }).join('');

      container.innerHTML = `<div class="grid grid-cols-1 gap-6">${cards}</div>`;
    }

    // ── Render Blog Ideas ─────────────────────────────────────────────────────

    function renderBlog(text, reviews) {
      const container = document.getElementById('blog-content');
      if (!text) {
        container.innerHTML = '<p class="text-on-surface-variant text-center py-10">No blog ideas available.</p>';
        return;
      }

      const body = text.replace(/^[^\n]*SECTION[^\n]*\n*/i, '').trim();

      const itemRe = /^[\*#\s]*\d+\./gim;
      const itemStarts = [];
      let im;
      while ((im = itemRe.exec(body)) !== null) itemStarts.push(im.index);

      if (!itemStarts.length) {
        container.innerHTML = '<p class="text-on-surface-variant text-center py-10">No blog ideas found.</p>';
        return;
      }

      const rawItems = itemStarts.map((start, i) =>
        body.slice(start, itemStarts[i + 1] ?? body.length).trim()
      );

      const FORMAT_COLORS = {
        'how-to':     'bg-blue-50 text-blue-700',
        'listicle':   'bg-green-50 text-green-700',
        'opinion':    'bg-orange-50 text-orange-700',
        'case study': 'bg-yellow-50 text-yellow-700',
        'myth':       'bg-red-50 text-red-700',
        'checklist':  'bg-teal-50 text-teal-700',
        'default':    'bg-surface-container text-on-surface-variant',
      };

      function formatBadgeColor(f) {
        f = (f || '').toLowerCase();
        for (const [key, cls] of Object.entries(FORMAT_COLORS))
          if (f.includes(key)) return cls;
        return FORMAT_COLORS.default;
      }

      // "Review 30 (1 star)" / "Review 30 (Sendcloud — 1 star)" → button + star badge
      function renderSourceReviews(sourceStr) {
        if (!sourceStr) return '';
        const linked = sourceStr
          .replace(/Review\s+(\d+)(?:\s*\([^)]*?(\d)\s*stars?\))?/gi, (match, num, starCount) => {
            const review = reviews[parseInt(num) - 1];
            const rating = starCount || (review && review.rating) || 0;
            const btn = review
              ? `<button onclick="goToReview(${num})"
                  style="color:#00b67a;background:rgba(0,182,122,0.09)" class="group inline-flex items-center gap-1 font-semibold text-xs px-2 py-0.5 rounded-full transition-colors mr-1 cursor-pointer hover:opacity-80">
                  Review ${num} <span class="material-symbols-outlined transition-transform group-hover:rotate-45" style="font-size:12px;line-height:1">north_east</span>
                </button>`
              : `<span class="text-xs font-semibold mr-1">Review ${num}</span>`;
            return btn + starBadge(rating);
          });
        return `<div class="border-t border-outline-variant/10 pt-3 mt-3">
          <span class="text-xs text-on-surface-variant font-medium mr-2">Source reviews:</span>${linked}
        </div>`;
      }

      const cards = rawItems.map(item => {
        const lines = item.split('\n');
        const headline = stripMd(lines[0]).replace(/^\d+\.\s*/, '').trim();
        if (!headline) return '';

        const format  = getField(item, 'Format:');
        const source  = getField(item, 'Source Reviews?:');

        const sumStart = item.search(/\*{0,2}Brief Summary:\*{0,2}/i);
        const srcStart = item.search(/\n\s*\*{0,2}Source Reviews?:/i);
        let summary = '';
        if (sumStart !== -1) {
          const end = srcStart !== -1 ? srcStart : item.length;
          summary = item.slice(sumStart, end)
            .replace(/^\*{0,2}Brief Summary:\*{0,2}\s*/i, '')
            .replace(/^\s*[\*\-]\s*/gm, '')
            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
            .trim();
        }

        return `
          <div class="bg-white rounded-2xl border border-outline-variant/15 p-6 hover:shadow-md transition-shadow flex flex-col gap-3">
            ${format ? `<span class="self-start text-xs font-semibold px-2 py-0.5 rounded-full ${formatBadgeColor(format)}">${format}</span>` : ''}
            <h3 class="font-bold text-base text-on-surface leading-snug">${headline}</h3>
            ${summary ? `<p class="text-sm text-on-surface-variant leading-relaxed">${summary}</p>` : ''}
            ${renderSourceReviews(source)}
          </div>`;
      }).filter(c => c).join('');

      container.innerHTML = `<div class="grid grid-cols-1 md:grid-cols-2 gap-6">${cards}</div>`;
    }

    // ── Main loader ───────────────────────────────────────────────────────────

    async function loadWeekData() {
      const week = getWeekParam();
      if (!week) {
        document.getElementById('loading').textContent = 'No week specified in URL.';
        return;
      }

      document.getElementById('page-title').textContent = week;

      try {
        const [reviewsRes, reportRes] = await Promise.all([
          fetch(`data/${week}/reviews.json?t=` + Date.now()),
          fetch(`data/${week}/report.json?t=`  + Date.now()),
        ]);

        const reviewsData = reviewsRes.ok  ? await reviewsRes.json() : { reviews: [] };
        const reportData  = reportRes.ok   ? await reportRes.json()  : {};

        const reviews    = reviewsData.reviews || [];
        const reportText = reportData.report_text || '';
        const sections   = parseReport(reportText);

        document.getElementById('loading').classList.add('hidden');
        document.getElementById('page-title').textContent = week;
        document.getElementById('stats').classList.remove('hidden');
        document.getElementById('stats').innerHTML = `
          <p>${reviews.length} reviews collected</p>
          <p>Generated ${reportData.generated_at ? new Date(reportData.generated_at).toLocaleDateString() : '—'}</p>
        `;

        renderReviews(reviews);
        renderAnalysis(sections.analysis);
        renderBlog(sections.blog, reviews);

        showTab('reviews');

      } catch (e) {
        document.getElementById('loading').textContent = 'Failed to load report data: ' + e.message;
      }
    }

    loadWeekData();
  </script>

<script>
(function () {
    const blob1 = document.getElementById('hero-blob-1');
    const blob2 = document.getElementById('hero-blob-2');
    if (!blob1 || !blob2) return;
    let tx = 50, ty = 50, cx = 50, cy = 50;
    document.addEventListener('mousemove', (e) => {
        tx = (e.clientX / window.innerWidth)  * 100;
        ty = (e.clientY / window.innerHeight) * 100;
    }, { passive: true });
    (function loop() {
        cx += (tx - cx) * 0.06;
        cy += (ty - cy) * 0.06;
        blob1.style.left = cx + '%'; blob1.style.top = cy + '%'; blob1.style.transform = 'translate(-50%,-50%)';
        blob2.style.left = (100 - cx * 0.6) + '%'; blob2.style.top = (cy * 0.5) + '%'; blob2.style.transform = 'translate(-50%,-50%)';
        requestAnimationFrame(loop);
    })();
})();
</script>
