<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trustpilot Review Reports — Borderless360</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #f6f6ff; color: #272e42; }
    h1, h2, h3 { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="min-h-screen">

  <!-- Header -->
  <header class="bg-white border-b border-gray-200 px-6 py-4">
    <div class="max-w-5xl mx-auto flex items-center justify-between">
      <div>
        <a href="../index.html" class="text-sm text-purple-600 hover:underline">← Back to Marketing Tools</a>
        <h1 class="text-2xl font-bold mt-1">Trustpilot Review Reports</h1>
        <p class="text-gray-500 text-sm mt-0.5">Weekly scrapes from competitor Trustpilot pages — analyzed by Gemini AI</p>
      </div>
    </div>
  </header>

  <!-- Content -->
  <main class="max-w-5xl mx-auto px-6 py-10">

    <!-- Loading state -->
    <div id="loading" class="text-center py-20 text-gray-400">
      <div class="text-4xl mb-4">⏳</div>
      <p>Loading reports...</p>
    </div>

    <!-- Empty state -->
    <div id="empty" class="hidden text-center py-20 text-gray-400">
      <div class="text-4xl mb-4">📭</div>
      <p class="font-medium">No reports yet</p>
      <p class="text-sm mt-1">Run <code class="bg-gray-100 px-1 rounded">./publish.sh</code> to generate the first report.</p>
    </div>

    <!-- Weeks grid -->
    <div id="weeks-grid" class="hidden grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>

  </main>

  <script>
    async function loadWeeks() {
      try {
        const res = await fetch('data/weeks.json?t=' + Date.now());
        if (!res.ok) throw new Error('No weeks index found');
        const weeks = await res.json();

        document.getElementById('loading').classList.add('hidden');

        if (!weeks.length) {
          document.getElementById('empty').classList.remove('hidden');
          return;
        }

        const grid = document.getElementById('weeks-grid');
        grid.classList.remove('hidden');

        weeks.forEach((w, i) => {
          const card = document.createElement('a');
          card.href = `week.html?week=${w.week}`;
          card.className = [
            'block bg-white rounded-2xl border border-gray-200 p-6',
            'hover:shadow-lg hover:border-purple-300 transition-all duration-200',
            'cursor-pointer'
          ].join(' ');

          const badge = i === 0
            ? '<span class="text-xs font-semibold bg-purple-100 text-purple-700 px-2 py-0.5 rounded-full">Latest</span>'
            : '';

          card.innerHTML = `
            <div class="flex items-start justify-between mb-3">
              <span class="text-xs font-mono text-gray-400">${w.week}</span>
              ${badge}
            </div>
            <h3 class="font-bold text-lg leading-tight mb-1">${w.label}</h3>
            <p class="text-sm text-gray-500">${w.date}</p>
            <div class="mt-4 flex items-center text-purple-600 text-sm font-medium">
              View report <span class="ml-1">→</span>
            </div>
          `;
          grid.appendChild(card);
        });

      } catch (e) {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('empty').classList.remove('hidden');
      }
    }

    loadWeeks();
  </script>
</body>
</html>
