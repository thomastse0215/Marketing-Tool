<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Report — MarketingAI</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "outline-variant": "#a5adc6",
            "surface-container":         "#e2e7ff",
            "surface-container-low":     "#eef0ff",
            "surface-container-high":    "#d9e2ff",
            "surface-container-lowest":  "#ffffff",
            "on-surface":         "#272e42",
            "on-surface-variant": "#535b71",
            "on-primary":         "#f7f0ff",
            "primary":            "#6200EE",
            "primary-container":  "#ac8eff",
            "secondary":          "#00C8DC",
          },
          fontFamily: { "headline": ["Plus Jakarta Sans"], "body": ["Inter"] },
          borderRadius: { "DEFAULT": "1rem", "lg": "2rem", "full": "9999px" },
        },
      },
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; background: #f6f6ff; color: #272e42; line-height: 1.6; }
    h1, h2, h3 { font-family: 'Plus Jakarta Sans', sans-serif; line-height: 1.2; }
    .tab-btn.active { background: #007a87; color: white; }
    .tab-btn { transition: all 0.15s; }
    .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  </style>
</head>
<body class="min-h-screen">

  <!-- Nav — aligned with homepage -->
  <nav class="bg-white/90 backdrop-blur-xl border-b border-outline-variant/15 sticky top-0 z-10">
    <div class="max-w-7xl mx-auto px-4 sm:px-8 py-4 flex items-center justify-between gap-4">
      <a href="../index.html" class="text-lg font-black tracking-tighter text-[#6a1cf6] font-headline shrink-0">Marketing<span class="text-[#00C8DC]">AI</span></a>
      <div class="flex items-center gap-3 min-w-0">
        <nav class="hidden sm:flex items-center gap-2 text-sm text-on-surface-variant shrink-0" aria-label="Breadcrumb">
          <a href="../index.html" class="hover:text-primary transition-colors">Home</a>
          <span class="text-outline-variant">›</span>
          <a href="../overview.html" class="hover:text-primary transition-colors">Reports</a>
          <span class="text-outline-variant">›</span>
          <a href="index.html" class="hover:text-[#007a87] transition-colors">Reddit</a>
          <span class="text-outline-variant">›</span>
        </nav>
        <h1 id="page-title" class="text-sm sm:text-base font-bold text-on-surface truncate">Loading...</h1>
      </div>
      <div id="stats" class="hidden text-right text-sm text-on-surface-variant shrink-0"></div>
    </div>
  </nav>

  <!-- Tabs -->
  <div class="bg-white border-b border-outline-variant/10 px-4 sm:px-6">
    <div class="max-w-7xl mx-auto flex gap-2 py-3 overflow-x-auto">
      <button class="tab-btn active text-sm font-medium px-4 py-2 rounded-lg whitespace-nowrap" onclick="showTab('posts')">📋 Reddit Posts</button>
      <button class="tab-btn text-sm font-medium px-4 py-2 rounded-lg text-on-surface-variant hover:bg-surface-container-low whitespace-nowrap" onclick="showTab('analysis')">🔍 Pain Point Analysis</button>
      <button class="tab-btn text-sm font-medium px-4 py-2 rounded-lg text-on-surface-variant hover:bg-surface-container-low whitespace-nowrap" onclick="showTab('blog')">✍️ Blog Ideas</button>
    </div>
  </div>

  <!-- Main -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8">

    <!-- Loading -->
    <div id="loading" class="text-center py-20 text-on-surface-variant">
      <div class="text-4xl mb-4">⏳</div>
      <p>Loading report data...</p>
    </div>

    <!-- Posts Tab -->
    <div id="tab-posts" class="hidden">
      <div id="posts-filter" class="flex flex-wrap gap-2 mb-6"></div>
      <div id="posts-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
    </div>

    <!-- Analysis Tab -->
    <div id="tab-analysis" class="hidden">
      <div id="analysis-content"></div>
    </div>

    <!-- Blog Tab -->
    <div id="tab-blog" class="hidden">
      <div id="blog-filter" class="flex flex-wrap gap-2 mb-6"></div>
      <div id="blog-content"></div>
    </div>

  </main>

  <script>
    // ── Helpers ──────────────────────────────────────────────────────────────

    function getWeekParam() {
      return new URLSearchParams(window.location.search).get('week');
    }

    function goToPost(n) {
      showTab('posts');
      setTimeout(() => {
        const el = document.getElementById('post-card-' + n);
        if (!el) return;
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        el.classList.add('ring-2', 'ring-primary');
        setTimeout(() => el.classList.remove('ring-2', 'ring-primary'), 2000);
      }, 60);
    }

    function showTab(name) {
      ['posts', 'analysis', 'blog'].forEach(t => {
        document.getElementById('tab-' + t).classList.add('hidden');
      });
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('active');
        btn.classList.add('text-on-surface-variant');
      });
      document.getElementById('tab-' + name).classList.remove('hidden');
      document.querySelectorAll('.tab-btn').forEach(btn => {
        if (btn.getAttribute('onclick') === `showTab('${name}')`) {
          btn.classList.add('active');
          btn.classList.remove('text-on-surface-variant');
        }
      });
    }

    // ── Clean raw Gemini text ─────────────────────────────────────────────────

    function cleanText(text) {
      return text
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/^\s*\*{1,2}\s+/gm, '')
        .replace(/^\s*•\s+/gm, '');
    }

    // ── Link (Post N) references ──────────────────────────────────────────────

    function postButton(num) {
      return `<button onclick="goToPost(${num})"
        class="inline-flex items-center gap-1 text-primary hover:text-primary-container font-semibold text-xs bg-primary/8 hover:bg-primary/12 px-2 py-0.5 rounded-full transition-colors cursor-pointer">
        Post ${num} ↗
      </button>`;
    }

    function linkPostRefs(text, posts) {
      return text.replace(/\(Post\s+([\d,\s]+?)(,?\s*comment[^)]+)?\)/gi, (match, numStr, commentPart) => {
        const nums = numStr.split(',').map(s => s.trim()).filter(s => /^\d+$/.test(s));
        if (!nums.length) return match;
        const buttons = nums.map(n => postButton(n)).join(' ');
        const commentLabel = commentPart ? commentPart.replace(/^,?\s*/, ', ') : '';
        return buttons + (commentLabel ? `<span class="text-xs text-on-surface-variant">${commentLabel}</span>` : '');
      });
    }

    // ── Parse Gemini report text into sections ────────────────────────────────

    function parseReport(text) {
      const sections = { analysis: '', blog: '' };
      if (!text) return sections;

      const s2 = text.indexOf('**SECTION 2:');
      const s3 = text.indexOf('**SECTION 3:');

      if (s2 !== -1 && s3 !== -1) sections.analysis = text.slice(s2, s3).trim();
      else if (s2 !== -1) sections.analysis = text.slice(s2).trim();

      if (s3 !== -1) sections.blog = text.slice(s3).trim();

      return sections;
    }

    // ── Generic filter pill builder ───────────────────────────────────────────

    function buildFilterPills(containerId, labels, onFilter) {
      const container = document.getElementById(containerId);
      if (!labels.length) { container.innerHTML = ''; return; }

      let active = null;

      function pill(label) {
        const btn = document.createElement('button');
        btn.textContent = label;
        btn.dataset.label = label;
        btn.className = 'filter-pill text-xs font-semibold px-3 py-1.5 rounded-full border transition-colors ' +
          (label === 'All'
            ? 'bg-primary text-on-primary border-primary'
            : 'bg-white text-on-surface-variant border-outline-variant/40 hover:border-primary/40 hover:text-primary');
        btn.addEventListener('click', () => {
          active = label === 'All' ? null : label;
          container.querySelectorAll('.filter-pill').forEach(b => {
            const isActive = (active === null && b.dataset.label === 'All') ||
                             (active !== null && b.dataset.label === active);
            b.className = 'filter-pill text-xs font-semibold px-3 py-1.5 rounded-full border transition-colors ' +
              (isActive
                ? 'bg-primary text-on-primary border-primary'
                : 'bg-white text-on-surface-variant border-outline-variant/40 hover:border-primary/40 hover:text-primary');
          });
          onFilter(active);
        });
        return btn;
      }

      container.innerHTML = '';
      ['All', ...labels].forEach(l => container.appendChild(pill(l)));
    }

    // ── Render posts ──────────────────────────────────────────────────────────

    function renderPosts(posts) {
      const grid = document.getElementById('posts-grid');

      if (!posts.length) {
        grid.innerHTML = '<p class="text-on-surface-variant col-span-2 text-center py-10">No posts found for this week.</p>';
        return;
      }

      posts.forEach((post, idx) => {
        const postNum = idx + 1;
        const comments = post.comments || [];
        const commentPreview = comments.slice(0, 3).map((c, i) =>
          `<div class="text-xs text-on-surface-variant border-l-2 border-primary/15 pl-3 mt-2">
            <span class="font-semibold text-on-surface-variant">[${i+1}]</span>
            ${c.body.slice(0, 150)}${c.body.length > 150 ? '…' : ''}
          </div>`
        ).join('');

        const card = document.createElement('div');
        card.id = 'post-card-' + postNum;
        card.dataset.subreddit = post.subreddit || '';
        card.className = 'post-card bg-white rounded-2xl border border-outline-variant/15 p-6 flex flex-col gap-3 hover:shadow-md transition-shadow';
        card.innerHTML = `
          <div class="flex items-center gap-2 flex-wrap">
            <span class="text-xs font-semibold bg-surface-container text-on-surface-variant px-2 py-0.5 rounded-full">Post ${postNum}</span>
            <span class="text-xs font-semibold bg-primary/10 text-primary px-2 py-0.5 rounded-full">r/${post.subreddit}</span>
            <span class="text-xs bg-surface-container-low text-on-surface-variant px-2 py-0.5 rounded-full">${post.matched_keyword}</span>
          </div>
          <a href="${post.url}" target="_blank" class="font-bold text-base leading-snug hover:text-primary transition-colors">
            ${post.title}
          </a>
          ${post.body ? `<p class="text-sm text-on-surface-variant line-clamp-3">${post.body.slice(0, 200)}${post.body.length > 200 ? '…' : ''}</p>` : ''}
          <div class="flex gap-4 text-xs text-on-surface-variant flex-wrap">
            <span>⬆️ ${post.score}</span>
            <span>💬 ${post.num_comments} comments</span>
            <span>${post.created_utc ? new Date(post.created_utc).toLocaleDateString() : ''}</span>
          </div>
          ${comments.length ? `
            <div class="border-t border-outline-variant/10 pt-3">
              <p class="text-xs font-semibold text-on-surface-variant mb-1">Top comments</p>
              ${commentPreview}
            </div>` : ''}
        `;
        grid.appendChild(card);
      });

      const subreddits = [...new Set(posts.map(p => p.subreddit).filter(Boolean))].sort();
      buildFilterPills('posts-filter', subreddits, (active) => {
        grid.querySelectorAll('.post-card').forEach(card => {
          card.classList.toggle('hidden', active !== null && card.dataset.subreddit !== active);
        });
      });
    }

    // ── Render Pain Point Analysis ────────────────────────────────────────────

    function renderAnalysis(text, posts) {
      const container = document.getElementById('analysis-content');
      if (!text) {
        container.innerHTML = '<p class="text-on-surface-variant text-center py-10">No analysis available.</p>';
        return;
      }

      const bodyText = text.replace(/^\*{0,2}SECTION\s+\d+[^\n]*\n*/im, '').trim();
      const rawThemes = bodyText.split(/\n(?=\*{0,2}Theme\s*\d*\s*:)/i).filter(s => s.trim());

      if (rawThemes.length <= 1) {
        container.innerHTML = `
          <div class="bg-white rounded-2xl border border-outline-variant/15 p-6">
            <div class="text-sm text-on-surface leading-relaxed">
              ${linkPostRefs(cleanText(bodyText), posts)}
            </div>
          </div>`;
        return;
      }

      const cards = rawThemes.map(block => {
        const lines = block.split('\n');

        const themeName = lines[0]
          .replace(/\*{0,2}Theme\s*\d*\s*:\s*/i, '')
          .replace(/\*+/g, '')
          .trim();

        const rest = lines.slice(1).join('\n').trim();

        const examplesIdx = rest.search(/(?:Paraphrased )?Reddit Examples?/i);
        let painHtml = '';
        let examplesHtml = '';

        if (examplesIdx !== -1) {
          const painRaw  = rest.slice(0, examplesIdx).trim();
          const examplesRaw = rest.slice(examplesIdx).trim();

          const painLines = painRaw.split('\n')
            .map(l => l.replace(/^\s*\*+\s*/g, '').replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/^\*+$/, '').trim())
            .filter(l => l);

          painHtml = painLines.length ? `
            <ul class="space-y-2 mb-4">
              ${painLines.map(l => `<li class="flex gap-2 text-sm text-on-surface"><span class="text-primary/60 shrink-0 mt-0.5">▸</span><span>${l}</span></li>`).join('')}
            </ul>` : '';

          const exampleLines = examplesRaw.split('\n')
            .slice(1)
            .map(l => l.replace(/^\s*\*+\s*/g, '').trim())
            .filter(l => l && !/^-{2,}$/.test(l));

          examplesHtml = exampleLines.length ? `
            <div class="border-t border-outline-variant/10 pt-4 mt-2">
              <p class="text-xs font-semibold text-on-surface-variant uppercase tracking-wide mb-3">Paraphrased Reddit Examples</p>
              <div class="space-y-2">
                ${exampleLines.map(l => `
                  <div class="flex gap-2 text-sm text-on-surface bg-surface-container-low rounded-lg px-3 py-2">
                    <span class="text-outline-variant shrink-0">"</span>
                    <span>${linkPostRefs(l.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>'), posts)}</span>
                  </div>`).join('')}
              </div>
            </div>` : '';

        } else {
          const allLines = rest.split('\n')
            .map(l => l.replace(/^\s*\*+\s*/g, '').replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').trim())
            .filter(l => l);

          painHtml = allLines.length ? `
            <ul class="space-y-2">
              ${allLines.map(l => `<li class="flex gap-2 text-sm text-on-surface"><span class="text-primary/60 shrink-0 mt-0.5">▸</span><span>${l}</span></li>`).join('')}
            </ul>` : '';
        }

        return `
          <div class="bg-white rounded-2xl border border-outline-variant/15 p-6 hover:shadow-md transition-shadow">
            <h3 class="font-bold text-base text-on-surface mb-4 flex items-start gap-2">
              <span class="text-primary shrink-0 mt-0.5">●</span>
              ${themeName}
            </h3>
            ${painHtml}
            ${examplesHtml}
          </div>`;
      }).join('');

      container.innerHTML = `<div class="grid grid-cols-1 gap-6">${cards}</div>`;
    }

    // ── Render Blog Ideas ─────────────────────────────────────────────────────

    function renderBlog(text, posts) {
      const container = document.getElementById('blog-content');
      if (!text) {
        container.innerHTML = '<p class="text-on-surface-variant text-center py-10">No blog ideas available.</p>';
        return;
      }

      const bodyText = text.replace(/^\*{0,2}SECTION\s+\d+[^\n]*\n*/im, '').trim();
      const rawItems = bodyText
        .split(/\n(?=\d+\.\s|\*{0,2}Headline:)/i)
        .filter(s => s.trim());

      if (!rawItems.length) {
        container.innerHTML = '<p class="text-on-surface-variant text-center py-10">No blog ideas found.</p>';
        return;
      }

      const FORMAT_COLORS = {
        'how-to':     'bg-blue-50 text-blue-700',
        'listicle':   'bg-green-50 text-green-700',
        'opinion':    'bg-orange-50 text-orange-700',
        'case study': 'bg-yellow-50 text-yellow-700',
        'myth':       'bg-red-50 text-red-700',
        'checklist':  'bg-teal-50 text-teal-700',
        'default':    'bg-surface-container text-on-surface-variant',
      };

      function formatBadgeColor(format) {
        const f = (format || '').toLowerCase();
        for (const [key, cls] of Object.entries(FORMAT_COLORS)) {
          if (f.includes(key)) return cls;
        }
        return FORMAT_COLORS.default;
      }

      function renderSourcePosts(sourceStr, posts) {
        if (!sourceStr) return '';
        const clean = sourceStr.replace(/\*+/g, '').trim();
        const linked = clean
          .replace(/Post\s+(\d+)/gi, (match, num) => {
            const post = posts[parseInt(num) - 1];
            if (post) {
              return `<button onclick="goToPost(${num})"
                class="inline-flex items-center gap-1 text-primary hover:text-primary-container font-semibold text-xs bg-primary/8 hover:bg-primary/12 px-2 py-0.5 rounded-full transition-colors mr-1 cursor-pointer">
                Post ${num} ↗
              </button>`;
            }
            return match;
          })
          .replace(/,\s*(?=<button)/g, ' ');
        return `
          <div class="border-t border-outline-variant/10 pt-3 mt-3">
            <span class="text-xs text-on-surface-variant font-medium mr-2">Source posts:</span>${linked}
          </div>`;
      }

      function formatToTags(format) {
        if (!format) return [];
        return format.split(/[\/,]/).map(t => t.trim()).filter(Boolean);
      }

      const cards = rawItems.map(item => {
        const headlineMatch = item.match(/(?:\d+\.\s*)?(?:\*{0,2}Headline:?\*{0,2}\s*)(.+?)(?:\n|$)/i);
        const formatMatch   = item.match(/Format:\s*(.+?)(?:\n|$)/i);
        const painMatch     = item.match(/(?:Mapped Pain|Pain Point|Addresses):\s*(.+?)(?:\n|$)/i);
        const sourceMatch   = item.match(/Source Posts?:\s*(.+?)(?:\n|$)/i);

        const headline = headlineMatch
          ? headlineMatch[1].replace(/\*+/g, '').replace(/Headline:?\s*/i, '').trim()
          : '';
        const format  = formatMatch  ? formatMatch[1].replace(/\*+/g, '').trim() : '';
        const pain    = painMatch    ? painMatch[1].replace(/\*+/g, '').trim() : '';
        const source  = sourceMatch  ? sourceMatch[1].replace(/\*+/g, '').trim() : '';

        const summaryIdx = item.search(/Brief Summary:\s*/i);
        const sourceLineIdx = item.search(/\n[\s*]*\*{0,2}\s*Source Posts?:/i);
        let summary = '';
        if (summaryIdx !== -1) {
          const end = sourceLineIdx !== -1 ? sourceLineIdx : item.length;
          summary = item.slice(summaryIdx, end)
            .replace(/^Brief Summary:\s*/i, '')
            .replace(/^\s*\*+\s*/gm, '')
            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
            .trim();
        }

        if (!headline) return '';

        const tags = formatToTags(format);
        const tagBadges = tags.map(t =>
          `<span class="text-xs font-semibold px-2 py-0.5 rounded-full ${formatBadgeColor(t)}">${t}</span>`
        ).join('');

        return `
          <div class="blog-card bg-white rounded-2xl border border-outline-variant/15 p-6 hover:shadow-md transition-shadow flex flex-col gap-3"
               data-tags="${tags.join('|')}">
            ${tagBadges ? `<div class="flex flex-wrap gap-1">${tagBadges}</div>` : ''}
            <h3 class="font-bold text-base text-on-surface leading-snug">${headline}</h3>
            ${summary ? `<p class="text-sm text-on-surface-variant leading-relaxed">${summary}</p>` : ''}
            ${pain ? `<p class="text-xs text-on-surface-variant"><span class="font-medium">Pain point:</span> ${pain}</p>` : ''}
            ${renderSourcePosts(source, posts)}
          </div>`;
      }).filter(c => c).join('');

      container.innerHTML = `<div id="blog-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6">${cards}</div>`;

      const allTags = [...new Set(
        rawItems.flatMap(item => {
          const m = item.match(/Format:\s*(.+?)(?:\n|$)/i);
          return m ? formatToTags(m[1].replace(/\*+/g, '')) : [];
        })
      )].sort();

      buildFilterPills('blog-filter', allTags, (active) => {
        document.querySelectorAll('.blog-card').forEach(card => {
          if (active === null) {
            card.classList.remove('hidden');
          } else {
            const tags = (card.dataset.tags || '').split('|');
            card.classList.toggle('hidden', !tags.includes(active));
          }
        });
      });
    }

    // ── Main loader ───────────────────────────────────────────────────────────

    async function loadWeekData() {
      const week = getWeekParam();
      if (!week) {
        document.getElementById('loading').textContent = 'No week specified in URL.';
        return;
      }

      document.getElementById('page-title').textContent = week;

      try {
        const [postsRes, reportRes] = await Promise.all([
          fetch(`data/${week}/posts.json?t=` + Date.now()),
          fetch(`data/${week}/report.json?t=`  + Date.now()),
        ]);

        const postsData  = postsRes.ok  ? await postsRes.json()  : { posts: [] };
        const reportData = reportRes.ok ? await reportRes.json() : {};

        const posts      = postsData.posts || [];
        const reportText = reportData.report_text || '';
        const sections   = parseReport(reportText);

        document.getElementById('loading').classList.add('hidden');
        document.getElementById('page-title').textContent = week;
        document.getElementById('stats').classList.remove('hidden');
        document.getElementById('stats').innerHTML = `
          <p>${posts.length} posts collected</p>
          <p>Generated ${reportData.generated_at ? new Date(reportData.generated_at).toLocaleDateString() : '—'}</p>
        `;

        renderPosts(posts);
        renderAnalysis(sections.analysis, posts);
        renderBlog(sections.blog, posts);

        showTab('posts');

      } catch (e) {
        document.getElementById('loading').textContent = 'Failed to load report data: ' + e.message;
      }
    }

    loadWeekData();
  </script>
</body>
</html>
